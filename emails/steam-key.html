<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your {{GAME_NAME}} Steam key</title>
<style>
	@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap");
</style>
</head>
<body style="margin:0; padding:0;">
	<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
		<tr>
			<td align="center" style="padding:32px 16px;">
				<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%;">
					<!-- Top strip -->
					<tr>
						<td style="background-color:#e6d7c6; height:44px; line-height:44px; font-size:0; border-radius:24px 24px 0 0;">&nbsp;</td>
					</tr>
					<!-- Body -->
					<tr>
						<td style="background-color:#ffffff; padding:48px 56px; font-family:'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif; color:#23272f;">
							<h1 style="margin:0 0 24px; font-size:26px; line-height:1.3; font-weight:700; color:#1e2233;">Thank you for your interest!</h1>
							<p style="margin:0 0 24px; font-size:18px; line-height:1.6;">We're really excited to see what you think of <strong>{{GAME_NAME}}</strong>.</p>
							<p style="margin:0 0 24px; font-size:18px; line-height:1.6;"><a href="https://help.steampowered.com/en/faqs/view/2A12-9D79-C3D7-F870" style="color:#23272f; text-decoration:underline;">Activate this key on Steam</a> to play it:</p>
							<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
								<tr>
									<td align="center" style="background-color:#e9f1f9; border-radius:16px; padding:28px 16px; font-family:'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif; font-size:28px; font-weight:700; letter-spacing:3px; color:#1e2a4a;">{{STEAM_KEY}}</td>
								</tr>
							</table>
							<p style="margin:32px 0 24px; font-size:18px; line-height:1.6;">If you want to give us feedback, you can press F3 at any time in the game to write to us, or you can contact us on Discord.</p>
							<p style="margin:0; font-size:18px; line-height:1.6;">Have fun!<br />🫶 from <strong>tiny doom</strong></p>
						</td>
					</tr>
					<!-- Footer -->
					<tr>
						<td style="background-color:#e6d7c6; padding:24px 40px; border-radius:0 0 24px 24px;">
							<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
								<tr>
									<td align="left" valign="middle">
										<a href="https://tinydoom.com" style="text-decoration:none;">
											<img src="https://tinydoom.com/logos/logo_x5.png" alt="tiny doom" height="64" style="display:inline-block; vertical-align:middle; border:0;" />
											<img src="https://tinydoom.com/logos/tinydoom_text.png" alt="TINY DOOM" height="44" style="display:inline-block; vertical-align:middle; margin-left:12px; border:0;" />
										</a>
									</td>
									<td align="right" valign="middle">
										<a href="https://x.com/tiny_doom" style="text-decoration:none;"><img src="https://tinydoom.com/socials/x.png" alt="X" height="28" style="display:inline-block; vertical-align:middle; border:0;" /></a>
										<a href="https://bsky.app/profile/tinydoom.com" style="text-decoration:none; margin-left:16px;"><img src="https://tinydoom.com/socials/bluesky.png" alt="Bluesky" height="28" style="display:inline-block; vertical-align:middle; border:0;" /></a>
									</td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
